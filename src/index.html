<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
</head>
<body>
    <header>
        <h1>Task Manager</h1>
        <div id="theme-toggle">
                <button id="theme-btn" class="btn">🌙 Dark Mode</button>
        </div>
    </header>
    
    <main class="app-layout">
        <!-- Sidebar for Projects -->
        <aside id="project-sidebar">
            <div class="sidebar-header">
                <h2>Projects</h2>
                <button id="add-project-btn" class="btn">+ New Project</button>
            </div>
            <ul id="project-list"></ul>
        </aside>

        <!-- Main container for Tasks -->
        <div class="task-container">
            <div class="task-header">
                <h2 id="current-project-title">Current Project Tasks</h2>
                <button id="add-task-btn" class="btn btn-primary">+ Add Task</button>
            </div>
            <ul id="task-list"></ul>
        </div>
    </main>
    
    <!-- Task Form Modal -->
    <dialog id="todo-modal">
        <form id="todo-form">
            <h3>Task Details</h3>
            <div class="form-group">
                <input type="text" id="title" placeholder="Task Title" required>
            </div>
            <div class="form-group">
                <textarea id="desc" placeholder="Description" rows="3"></textarea>
            </div>
            <div class="form-group">
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <select id="priority">
                    <option value="low">Low Priority</option>
                    <option value="medium">Medium Priority</option>
                    <option value="high">High Priority</option>
                </select>
            </div>
            <div class="form-actions">
                <button type="button" id="btn-close-modal" class="btn">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Task</button>
            </div>
        </form>
    </dialog>
</body>
</html>
